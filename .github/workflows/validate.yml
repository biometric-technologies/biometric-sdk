name: Validate project build

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - master
      - dev

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check Out
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app && xcodebuild -version

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Cocoapods
        run: gem install cocoapods

      - name: Build project
        run: |
          set -o pipefail
          ./gradlew clean build podPublishDebugXCFramework 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|FAILED|Could not |Exception" build.log | head -40 | sed 's/^/::error::/' || true

  jvm-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: JVM tests and Android compilation
        run: |
          set -o pipefail
          ./gradlew jvmTest compileDebugKotlinAndroid --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|FAILED|Could not |Exception" build.log | head -40 | sed 's/^/::error::/' || true
