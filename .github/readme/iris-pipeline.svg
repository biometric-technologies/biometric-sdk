<svg xmlns="http://www.w3.org/2000/svg" width="960" height="262" viewBox="0 0 960 262" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Eye image to template to match score">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c77c3"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="261" rx="16" fill="#ffffff" stroke="#d0d7de"/>
<!-- eye image -->
<g transform="translate(40,55)">
<rect width="150" height="110" rx="10" fill="#eaf4ff" stroke="#1c77c3"/>
<ellipse cx="75" cy="55" rx="55" ry="30" fill="#ffffff" stroke="#0a328f" stroke-width="2"/>
<circle cx="75" cy="55" r="24" fill="#5cc8ff"/><circle cx="75" cy="55" r="10" fill="#0a328f"/>
<circle cx="68" cy="48" r="3" fill="#ffffff"/>
<text x="75" y="135" text-anchor="middle" font-size="15" fill="#0a328f">Eye image</text>
<text x="75" y="153" text-anchor="middle" font-size="13" fill="#57606a">near-infrared camera</text>
</g>
<path d="M195,110 L245,110" stroke="#1c77c3" stroke-width="2" marker-end="url(#a)"/>
<!-- extract -->
<g transform="translate(250,55)">
<rect width="170" height="110" rx="10" fill="#eaf4ff" stroke="#1c77c3"/>
<text x="85" y="42" text-anchor="middle" font-size="16" fill="#0a328f">Find the iris</text>
<text x="85" y="64" text-anchor="middle" font-size="13" fill="#57606a">pupil, outer edge,</text>
<text x="85" y="82" text-anchor="middle" font-size="13" fill="#57606a">eyelids masked out</text>
<text x="85" y="135" text-anchor="middle" font-size="13" fill="#57606a">iris().extractor()</text>
</g>
<path d="M425,110 L475,110" stroke="#1c77c3" stroke-width="2" marker-end="url(#a)"/>
<!-- encode -->
<g transform="translate(480,55)">
<rect width="170" height="110" rx="10" fill="#eaf4ff" stroke="#1c77c3"/>
<text x="85" y="36" text-anchor="middle" font-size="16" fill="#0a328f">Make a template</text>
<g transform="translate(25,50)">
<rect width="120" height="14" fill="#ffffff" stroke="#1c77c3"/>
<rect x="0" y="0" width="8" height="14" fill="#0a328f"/><rect x="16" y="0" width="8" height="14" fill="#0a328f"/><rect x="24" y="0" width="8" height="14" fill="#0a328f"/><rect x="48" y="0" width="8" height="14" fill="#0a328f"/><rect x="64" y="0" width="8" height="14" fill="#0a328f"/><rect x="88" y="0" width="8" height="14" fill="#0a328f"/><rect x="96" y="0" width="8" height="14" fill="#0a328f"/><rect x="112" y="0" width="8" height="14" fill="#0a328f"/>
</g>
<text x="85" y="88" text-anchor="middle" font-size="13" fill="#57606a">a string of bits, a few KB</text>
<text x="85" y="135" text-anchor="middle" font-size="13" fill="#57606a">iris().encoder()</text>
</g>
<path d="M655,110 L705,110" stroke="#1c77c3" stroke-width="2" marker-end="url(#a)"/>
<!-- match -->
<g transform="translate(710,55)">
<rect width="210" height="110" rx="10" fill="#eaf4ff" stroke="#1c77c3"/>
<text x="105" y="36" text-anchor="middle" font-size="16" fill="#0a328f">Compare two templates</text>
<text x="105" y="60" text-anchor="middle" font-size="13" fill="#57606a">count the bits that differ</text>
<text x="105" y="90" text-anchor="middle" font-size="20" font-weight="600" fill="#1c77c3">0.83 → match</text>
<text x="105" y="135" text-anchor="middle" font-size="13" fill="#57606a">iris().matcher()</text>
</g>
<text x="480" y="240" text-anchor="middle" font-size="14" fill="#57606a">Store the template, not the photo. The same template matches on a phone, a laptop and a server.</text>
</svg>
